name: 'dev_dv_dbt'
version: '1.0.0'

profile: 'demo_dbt'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

vars:
  partner_raw_database: BAGIC_PROD_MIRROR_DB
  partner_raw_schema: OPUS_GG_DWHSTAGE
  partner_test_raw_database: BAGIC_PREPROD_CURATED_DB
  partner_test_raw_schema: UTILS
  health_raw_database: BAGIC_PROD_MIRROR_DB
  health_raw_schema: OPUS_GG_DWHSTAGE
  health_test_raw_database: BAGIC_PREPROD_CURATED_DB
  health_test_raw_schema: UTILS

models:
  dev_dv_dbt:
    +pre-hook:
      - "{% if target.name == 'dev' %}INSERT INTO BAGIC_PREPROD_CURATED_DB.UTILS.MAXI_RAW_DBT_MODEL_RUN_LOG (model_name, status, run_id, run_start_timestamp, materialization, schema_name, target_table) SELECT '{{ this.name }}', 'RUNNING', '{{ invocation_id }}', '{{ run_started_at }}'::TIMESTAMP_NTZ, '{{ config.get(\"materialized\", \"view\") }}', '{{ this.schema }}', '{{ this.database }}.{{ this.schema }}.{{ this.name }}'{% endif %}"
    +post-hook:
      - "{% if target.name == 'dev' %}UPDATE BAGIC_PREPROD_CURATED_DB.UTILS.MAXI_RAW_DBT_MODEL_RUN_LOG SET status = 'SUCCESS' WHERE model_name = '{{ this.name }}' AND run_id = '{{ invocation_id }}' AND status = 'RUNNING'{% endif %}"
    staging:
      +materialized: view
      +schema: BGIL_DEV_DATA_MODEL
      partner:
        +materialized: view
        +schema: BGIL_DEV_DATA_MODEL
        +tags: ["partner", "partner_stg"]
      travel:
        +materialized: view
        +schema: BGIL_DEV_DATA_MODEL
        +tags: ["travel", "travel_stg"]
      health:
        +materialized: view
        +schema: BGIL_DEV_DATA_MODEL
        +tags: ["health", "health_stg"]
    raw_vault:
      partner:
        +tags: ["partner"]
        standard:
          +schema: BGIL_DEV_DATA_MODEL
          stitched:
            +materialized: view
            +tags: ["partner", "partner_stitch"]
          staging:
            +materialized: view
            +tags: ["partner", "partner_stg2"]
          hubs:
            +materialized: incremental
            +tags: ["partner", "partner_hub"]
          links:
            +materialized: incremental
            +tags: ["partner", "partner_lnk"]
          satellites:
            +materialized: incremental
            +tags: ["partner", "partner_sat"]
          references:
            +materialized: view
            +tags: ["partner", "partner_ref"]
        augmented:
          +schema: BGIL_DEV_DATA_MODEL
          +tags: ["partner", "partner_aug"]
          staging:
            +materialized: view
            +tags: ["partner", "partner_aug_stg"]
          satellites:
            +materialized: incremental
            +tags: ["partner", "partner_aug_sat"]
      health:
        +tags: ["health"]
        standard:
          +schema: BGIL_DEV_DATA_MODEL
          stitched:
            +materialized: view
            +tags: ["health", "health_stitch"]
          staging:
            +materialized: view
            +tags: ["health", "health_stg2"]
          hubs:
            +materialized: incremental
            +tags: ["health", "health_hub"]
          links:
            +materialized: incremental
            +tags: ["health", "health_lnk"]
          satellites:
            +materialized: incremental
            +tags: ["health", "health_sat"]
          references:
            +materialized: view
            +tags: ["health", "health_ref"]
        augmented:
          +schema: BGIL_DEV_DATA_MODEL
          +tags: ["health", "health_aug"]
          staging:
            +materialized: view
            +tags: ["health", "health_aug_stg"]
          satellites:
            +materialized: incremental
            +tags: ["health", "health_aug_sat"]

