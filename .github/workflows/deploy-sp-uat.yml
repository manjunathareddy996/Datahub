name: Snowflake Deploy (uat - changed SQL only)
on:
  push:
    branches: [ uat ]
    paths:
      - "SQL_DIR/**/*.sql"
      - ".github/workflows/deploy-sp-uat.yml"

env:
  ENV: uat
  SQL_ROOT: SQL_DIR

jobs:
  deploy:
    runs-on: [self-hosted, Linux, X64] # change to ubuntu-latest if you prefer
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Ensure SnowSQL
        run: |
          set -euo pipefail

          if command -v snowsql >/uat/null 2>&1; then
            echo "SnowSQL already available on runner:"
            snowsql --version
            exit 0
          fi

          if [[ -z "${SNOWSQL_INSTALLER_URI:-}" ]]; then
            echo "SnowSQL is not installed on this runner and SNOWSQL_INSTALLER_URI is not configured." >&2
            echo "Install SnowSQL on the runner manually or provide an installer URI (e.g., S3 path)." >&2
            exit 1
          fi

          echo "Downloading SnowSQL installer from ${SNOWSQL_INSTALLER_URI}"
          aws s3 cp "${SNOWSQL_INSTALLER_URI}" snowsql.rpm
          if [[ ! -s snowsql.rpm ]]; then
            echo "Failed to download SnowSQL installer from ${SNOWSQL_INSTALLER_URI}" >&2
            exit 1
          fi

          sudo rpm -Uvh --replacepkgs snowsql.rpm
          echo "$HOME/.snowsql/bin" >> $GITHUB_PATH
          snowsql --version
          rm -f snowsql.rpm

      - name: Export Snowflake creds from GitHub Secrets (UAT)
        run: |
          echo "SNOWFLAKE_ACCOUNT=${{ secrets.SNOWFLAKE_ACCOUNT_UAT }}" >> $GITHUB_ENV
          echo "SNOWFLAKE_USERNAME=${{ secrets.SNOWFLAKE_USERNAME_UAT }}" >> $GITHUB_ENV
          echo "SNOWFLAKE_ROLE=${{ secrets.SNOWFLAKE_ROLE_UAT }}" >> $GITHUB_ENV
          echo "SNOWFLAKE_WAREHOUSE=${{ secrets.SNOWFLAKE_WAREHOUSE_UAT }}" >> $GITHUB_ENV
          echo "SNOWFLAKE_DATABASE=${{ secrets.SNOWFLAKE_DATABASE_UAT }}" >> $GITHUB_ENV # e.g., UAT_DB
          echo "SNOWFLAKE_SCHEMA=${{ secrets.SNOWFLAKE_SCHEMA_UAT }}" >> $GITHUB_ENV # e.g., APP
          echo "SNOWFLAKE_PRIVATE_KEY_URI=${{ secrets.SNOWFLAKE_PRIVATE_KEY_URI_UAT }}" >> $GITHUB_ENV
          echo "SNOWFLAKE_PRIVATE_KEY_PASSPHRASE=${{ secrets.SNOWFLAKE_PRIVATE_KEY_PASSPHRASE_UAT }}" >> $GITHUB_ENV
          echo "SNOWSQL_INSTALLER_URI=${{ secrets.SNOWSQL_INSTALLER_URI }}" >> $GITHUB_ENV
          echo "SES_SMTP_USERNAME=${{ secrets.SNOWFLAKE_DEPLOY_SES_SMTP_USERNAME_UAT }}" >> $GITHUB_ENV
          echo "SES_SMTP_PASSWORD=${{ secrets.SNOWFLAKE_DEPLOY_SES_SMTP_PASSWORD_UAT }}" >> $GITHUB_ENV
          echo "SES_EMAIL_REGION=${{ secrets.SNOWFLAKE_DEPLOY_SES_REGION_UAT }}" >> $GITHUB_ENV
          echo "SES_EMAIL_SENDER=${{ secrets.SNOWFLAKE_DEPLOY_EMAIL_SENDER_UAT }}" >> $GITHUB_ENV
          echo "SES_EMAIL_RECIPIENTS=${{ secrets.SNOWFLAKE_DEPLOY_EMAIL_RECIPIENTS_UAT }}" >> $GITHUB_ENV

      - name: Download Snowflake private key from S3
        run: |
          set -euo pipefail
          if [[ -z "${SNOWFLAKE_PRIVATE_KEY_URI:-}" ]]; then
            echo "SNOWFLAKE_PRIVATE_KEY_URI secret is not configured" >&2
            exit 1
          fi
          aws s3 cp "$SNOWFLAKE_PRIVATE_KEY_URI" snowflake_rsa_key.p8
          chmod 600 snowflake_rsa_key.p8
          if grep -q "ENCRYPTED" snowflake_rsa_key.p8; then
            if [[ -z "${SNOWFLAKE_PRIVATE_KEY_PASSPHRASE:-}" ]]; then
              echo "The downloaded Snowflake private key is encrypted but SNOWFLAKE_PRIVATE_KEY_PASSPHRASE_UAT is empty." >&2
              echo "Please set the passphrase secret or provide an unencrypted PKCS8 key." >&2
              exit 1
            fi
            openssl pkcs8 \
              -in snowflake_rsa_key.p8 \
              -topk8 \
              -nocrypt \
              -passin env:SNOWFLAKE_PRIVATE_KEY_PASSPHRASE \
              -out snowflake_rsa_key_decrypted.p8
            chmod 600 snowflake_rsa_key_decrypted.p8
            echo "SNOWFLAKE_PRIVATE_KEY_PATH=${PWD}/snowflake_rsa_key_decrypted.p8" >> $GITHUB_ENV
          else
            echo "SNOWFLAKE_PRIVATE_KEY_PATH=${PWD}/snowflake_rsa_key.p8" >> $GITHUB_ENV
          fi

      - name: List changed SQL files (range or single commit)
        id: diff
        shell: bash
        run: |
          set -euo pipefail
          
          if [[ -n "${{ github.event.before }}" && "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]]; then
            range="${{ github.event.before }}..${{ github.sha }}"
            pathspec=":(glob)${SQL_ROOT%/}/**/*.sql"
            CHANGED=$(git diff --name-only --diff-filter=ACMR "$range" -- "$pathspec")
          else
            # First push on branch or no 'before' SHA: check this commit only
            pathspec=":(glob)${SQL_ROOT%/}/**/*.sql"
            CHANGED=$(git diff-tree --no-commit-id --name-only -r "${GITHUB_SHA}" -- "$pathspec")
          fi
          
          printf "%s\n" "$CHANGED" > changed_files.txt
          CHANGED="${CHANGED//$'\n'/ }"
          echo "changed=${CHANGED}" >> "$GITHUB_OUTPUT"
          echo "Changed SQL:"
          cat changed_files.txt || true

      - name: Build deploy.sql snapshot
        if: ${{ steps.diff.outputs.changed != '' }}
        shell: bash
        run: |
          set -euo pipefail
          : > deploy.sql
          echo "-- env: ${ENV}" >> deploy.sql
          echo "USE ROLE ${SNOWFLAKE_ROLE};" >> deploy.sql
          echo "USE WAREHOUSE ${SNOWFLAKE_WAREHOUSE};" >> deploy.sql
          echo "USE DATABASE ${SNOWFLAKE_DATABASE};" >> deploy.sql
          echo "USE SCHEMA ${SNOWFLAKE_SCHEMA};" >> deploy.sql
          echo "-- Files deployed via snowsql" >> deploy.sql
          for f in ${{ steps.diff.outputs.changed }}; do
            rel="$f"
            {
              echo ""
              echo "-- file: ${rel}"
              cat "$rel"
              echo ""
            } >> deploy.sql
          done
          
          echo "----- deploy.sql -----"
          sed -n '1,200p' deploy.sql

      - name: Exit early (no changed SQL)
        if: ${{ steps.diff.outputs.changed == '' }}
        run: echo "No SQL changes under ${SQL_ROOT}; nothing to deploy."

      - name: Execute deployment in Snowflake (continue on individual failures)
        if: ${{ steps.diff.outputs.changed != '' }}
        shell: bash {0}
        run: |
          set -euo pipefail

          if [[ -z "${SES_SMTP_USERNAME:-}" || -z "${SES_SMTP_PASSWORD:-}" || -z "${SES_EMAIL_REGION:-}" || -z "${SES_EMAIL_SENDER:-}" || -z "${SES_EMAIL_RECIPIENTS:-}" ]]; then
            echo "SES SMTP configuration is incomplete. Ensure the required secrets are set." >&2
            exit 1
          fi

          snowsql_base=(
            snowsql
            -a "$SNOWFLAKE_ACCOUNT"
            -u "$SNOWFLAKE_USERNAME"
            -r "$SNOWFLAKE_ROLE"
            -w "$SNOWFLAKE_WAREHOUSE"
            -d "$SNOWFLAKE_DATABASE"
            -s "$SNOWFLAKE_SCHEMA"
            --private-key-path "$SNOWFLAKE_PRIVATE_KEY_PATH"
            -o exit_on_error=true
            -o friendly=false
            -o output_format=tsv
            -o timing=false
          )
          echo "Testing Snowflake connection..."
          "${snowsql_base[@]}" -q "SELECT CURRENT_USER(), CURRENT_ROLE(), CURRENT_DATABASE(), CURRENT_SCHEMA();"

          echo "Setting session context..."
          "${snowsql_base[@]}" -q "USE ROLE ${SNOWFLAKE_ROLE}; USE WAREHOUSE ${SNOWFLAKE_WAREHOUSE}; USE DATABASE ${SNOWFLAKE_DATABASE}; USE SCHEMA ${SNOWFLAKE_SCHEMA};"

          successes=()
          failures=()
          : > snow_exec_detail.log

          # Run each changed SQL file individually with snowsql
          while IFS= read -r f; do
            [[ -z "$f" ]] && continue
            rel="${f#./}" # keep SQL_DIR/ in place; only strip leading ./ if any

            echo "---- Executing file: ${rel}" | tee -a snow_exec_detail.log

            if out=$("${snowsql_base[@]}" -f "$rel" 2>&1); then
              successes+=("$rel")
              echo "SUCCESS: ${out}" >> snow_exec_detail.log
            else
              failures+=("$rel")
              err_first_line="$(printf '%s\n' "$out" | head -n 1)"
              echo "ERROR for ${rel}: ${err_first_line}" | tee -a snow_exec_detail.log
              echo "Full error output: $out" >> snow_exec_detail.log
            fi
            echo >> snow_exec_detail.log
          done < changed_files.txt
          echo "__SUMMARY__" >> snow_exec_detail.log
          echo "SUCCESS_COUNT=${#successes[@]}" >> snow_exec_detail.log
          echo "FAIL_COUNT=${#failures[@]}" >> snow_exec_detail.log

          ok_count=${#successes[@]}
          fail_count=${#failures[@]}
          subject="Snowflake deploy (${ENV}) ✔ ${ok_count} ok / ✖ ${fail_count} failed"

          {
            echo "Environment: ${ENV}"
            echo "Database.Schema: ${SNOWFLAKE_DATABASE}.${SNOWFLAKE_SCHEMA}"
            echo "Warehouse: ${SNOWFLAKE_WAREHOUSE}"
            echo
            echo "✅ SUCCEEDED (${ok_count}):"
            if (( ok_count > 0 )); then
              printf ' - %s\n' "${successes[@]}"
            else
              echo "  - (none)"
            fi
            echo
            echo "❌ FAILED (${fail_count}):"
            if (( fail_count > 0 )); then
              printf ' - %s\n' "${failures[@]}"
            else
              echo "  - (none)"
            fi
            echo
            echo "Detail log attached below."
            echo
            echo "===== DETAIL ====="
            cat snow_exec_detail.log
          } > email_message.txt

          EMAIL_SUBJECT="$subject" python - <<'PY'
          import os
          import smtplib
          import sys
          from email.mime.text import MIMEText

          try:
              username = os.environ["SES_SMTP_USERNAME"]
              password = os.environ["SES_SMTP_PASSWORD"]
              region = os.environ["SES_EMAIL_REGION"]
              sender = os.environ["SES_EMAIL_SENDER"]
              recipients_raw = os.environ["SES_EMAIL_RECIPIENTS"]
              subject = os.environ["EMAIL_SUBJECT"]

              recipients = [addr.strip() for addr in recipients_raw.split(",") if addr.strip()]
              if not recipients:
                  raise ValueError("SES_EMAIL_RECIPIENTS does not contain any valid recipients.")

              with open("email_message.txt", "r", encoding="utf-8") as payload:
                  body = payload.read()

              message = MIMEText(body, "plain")
              message["Subject"] = subject
              message["From"] = sender
              message["To"] = ", ".join(recipients)

              smtp_endpoint = f"email-smtp.{region}.amazonaws.com"
              with smtplib.SMTP(smtp_endpoint, 587) as client:
                  client.starttls()
                  client.login(username, password)
                  client.sendmail(sender, recipients, message.as_string())
          except Exception as exc:
              print(f"Failed to send SES email notification: {exc}", file=sys.stderr)
              sys.exit(1)
          PY

          echo "Execution completed. Summary:"
          echo "✅ Succeeded: ${ok_count} files"
          echo "❌ Failed: ${fail_count} files"

          if (( fail_count > 0 )); then
            echo "⚠️  Some SQL files failed to execute. Check the detailed logs for more information."
            echo "Failed files: ${failures[*]}"
            exit 1
          fi

      - name: Upload deploy.sql artifact
        if: ${{ steps.diff.outputs.changed != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: uat-deploy-sql
          path: deploy.sql

      - name: Upload execution detail log
        if: ${{ steps.diff.outputs.changed != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: snowflake-exec-detail
          path: snow_exec_detail.log

