name: Snowflake Deploy (prod - changed SQL only)

on:
  push:
    branches: [prod]
    paths:
      - "SQL_DIR/**/*.sql"

env:
  ENV: prod
  SQL_ROOT: SQL_DIR
  WORKFLOW_BOOTSTRAP_LOG: workflow_bootstrap.log

jobs:
  deploy:
    runs-on: [self-hosted, Linux, X64]
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Initialize deployment bootstrap log
        shell: bash
        run: |
          set -euo pipefail
          : > "${WORKFLOW_BOOTSTRAP_LOG}"
          {
            echo "========== START =========="
            date -u
            echo "Workflow=${GITHUB_WORKFLOW:-unknown}"
            echo "Run ID=${GITHUB_RUN_ID:-unknown}"
            echo "Ref Name=${GITHUB_REF_NAME:-unknown}"
          } | tee -a "${WORKFLOW_BOOTSTRAP_LOG}"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Ensure SnowSQL
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee -a "${WORKFLOW_BOOTSTRAP_LOG}") 2>&1

          if command -v snowsql >/dev/null 2>&1; then
            echo "SnowSQL already available on runner:"
            snowsql --version
            exit 0
          fi

          if [[ -z "${SNOWSQL_INSTALLER_URI:-}" ]]; then
            echo "SnowSQL is not installed on this runner and SNOWSQL_INSTALLER_URI is not configured." >&2
            echo "Install SnowSQL on the runner manually or provide an installer URI." >&2
            exit 1
          fi

          echo "Downloading SnowSQL installer from ${SNOWSQL_INSTALLER_URI}"
          aws s3 cp "${SNOWSQL_INSTALLER_URI}" snowsql.rpm

          if [[ ! -s snowsql.rpm ]]; then
            echo "Failed to download SnowSQL installer from ${SNOWSQL_INSTALLER_URI}" >&2
            exit 1
          fi

          sudo rpm -Uvh --replacepkgs snowsql.rpm
          echo "$HOME/.snowsql/bin" >> "$GITHUB_PATH"
          snowsql --version
          rm -f snowsql.rpm

      - name: Export Snowflake creds from GitHub Secrets (prod)
        shell: bash
        run: |
          exec > >(tee -a "${WORKFLOW_BOOTSTRAP_LOG}") 2>&1
          {
            echo "SNOWFLAKE_ACCOUNT=${{ secrets.SNOWFLAKE_ACCOUNT_PROD }}"
            echo "SNOWFLAKE_USERNAME=${{ secrets.SNOWFLAKE_USERNAME_PROD }}"
            echo "SNOWFLAKE_ROLE=${{ secrets.SNOWFLAKE_ROLE_PROD }}"
            echo "SNOWFLAKE_WAREHOUSE=${{ secrets.SNOWFLAKE_WAREHOUSE_PROD }}"
            echo "SNOWFLAKE_DATABASE=${{ secrets.SNOWFLAKE_DATABASE_PROD }}"
            echo "SNOWFLAKE_SCHEMA=${{ secrets.SNOWFLAKE_SCHEMA_PROD }}"
            echo "SNOWFLAKE_PRIVATE_KEY_URI=${{ secrets.SNOWFLAKE_PRIVATE_KEY_URI_PROD }}"
            echo "SNOWFLAKE_PRIVATE_KEY_PASSPHRASE=${{ secrets.SNOWFLAKE_PRIVATE_KEY_PASSPHRASE_PROD }}"
            echo "SNOWSQL_INSTALLER_URI=${{ secrets.SNOWSQL_INSTALLER_URI }}"
            echo "SES_SMTP_USERNAME=${{ secrets.SNOWFLAKE_DEPLOY_SES_SMTP_USERNAME_PROD }}"
            echo "SES_SMTP_PASSWORD=${{ secrets.SNOWFLAKE_DEPLOY_SES_SMTP_PASSWORD_PROD }}"
            echo "SES_EMAIL_REGION=${{ secrets.SNOWFLAKE_DEPLOY_SES_REGION_PROD }}"
            echo "SES_EMAIL_SENDER=${{ secrets.SNOWFLAKE_DEPLOY_EMAIL_SENDER_PROD }}"
            echo "SES_EMAIL_RECIPIENTS=${{ secrets.SNOWFLAKE_DEPLOY_EMAIL_RECIPIENTS_PROD }}"
            echo "S3_LOG_BUCKET_URI=${{ secrets.SNOWFLAKE_DEPLOY_LOG_S3_URI_PROD }}"
          } >> "$GITHUB_ENV"

      - name: Download Snowflake private key from S3
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee -a "${WORKFLOW_BOOTSTRAP_LOG}") 2>&1

          if [[ -z "${SNOWFLAKE_PRIVATE_KEY_URI:-}" ]]; then
            echo "SNOWFLAKE_PRIVATE_KEY_URI secret is not configured" >&2
            exit 1
          fi

          aws s3 cp "$SNOWFLAKE_PRIVATE_KEY_URI" snowflake_rsa_key.p8
          chmod 600 snowflake_rsa_key.p8

          if grep -q "ENCRYPTED" snowflake_rsa_key.p8; then
            if [[ -z "${SNOWFLAKE_PRIVATE_KEY_PASSPHRASE:-}" ]]; then
              echo "The downloaded Snowflake private key is encrypted but SNOWFLAKE_PRIVATE_KEY_PASSPHRASE_PROD is empty." >&2
              exit 1
            fi

            openssl pkcs8 \
              -in snowflake_rsa_key.p8 \
              -topk8 \
              -nocrypt \
              -passin env:SNOWFLAKE_PRIVATE_KEY_PASSPHRASE \
              -out snowflake_rsa_key_decrypted.p8

            chmod 600 snowflake_rsa_key_decrypted.p8
            echo "SNOWFLAKE_PRIVATE_KEY_PATH=${PWD}/snowflake_rsa_key_decrypted.p8" >> "$GITHUB_ENV"
          else
            echo "SNOWFLAKE_PRIVATE_KEY_PATH=${PWD}/snowflake_rsa_key.p8" >> "$GITHUB_ENV"
          fi

      - name: List changed SQL files
        id: diff
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee -a "${WORKFLOW_BOOTSTRAP_LOG}") 2>&1

          if [[ -n "${{ github.event.before }}" && "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]]; then
            range="${{ github.event.before }}..${{ github.sha }}"
            pathspec=":(glob)${SQL_ROOT%/}/**/*.sql"
            git diff --name-only --diff-filter=ACMR "$range" -- "$pathspec" | sed '/^[[:space:]]*$/d' > changed_files.txt
          else
            pathspec=":(glob)${SQL_ROOT%/}/**/*.sql"
            git diff-tree --no-commit-id --name-only -r "${GITHUB_SHA}" -- "$pathspec" | sed '/^[[:space:]]*$/d' > changed_files.txt
          fi

          echo "==== changed_files.txt ===="
          cat changed_files.txt || true

          if [[ -s changed_files.txt ]] && grep -q '[^[:space:]]' changed_files.txt; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Detected changed SQL files."
          else
            : > changed_files.txt
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No changed SQL files detected."
          fi

      - name: Build deploy.sql snapshot
        if: ${{ steps.diff.outputs.changed == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee -a "${WORKFLOW_BOOTSTRAP_LOG}") 2>&1

          : > deploy.sql
          echo "-- env: ${ENV}" >> deploy.sql
          echo "USE ROLE ${SNOWFLAKE_ROLE};" >> deploy.sql
          echo "USE WAREHOUSE ${SNOWFLAKE_WAREHOUSE};" >> deploy.sql
          echo "USE DATABASE ${SNOWFLAKE_DATABASE};" >> deploy.sql
          echo "USE SCHEMA ${SNOWFLAKE_SCHEMA};" >> deploy.sql
          echo "-- Files deployed via snowsql" >> deploy.sql

          while IFS= read -r f; do
            [[ -z "$f" ]] && continue
            {
              echo
              echo "-- file: ${f}"
              cat "$f"
              echo
            } >> deploy.sql
          done < changed_files.txt

          echo "----- deploy.sql -----"
          sed -n '1,200p' deploy.sql

      - name: Exit early (no changed SQL)
        if: ${{ steps.diff.outputs.changed == 'false' }}
        shell: bash
        run: |
          echo "No SQL changes under ${SQL_ROOT}; nothing to deploy." | tee -a "${WORKFLOW_BOOTSTRAP_LOG}"

      - name: Execute deployment in Snowflake
        if: ${{ steps.diff.outputs.changed == 'true' }}
        shell: bash
        run: |
          set -uo pipefail
          set -x

          LOG_FILE="snowflake_deploy_full.log"
          DETAIL_LOG="snow_exec_detail.log"

          : > "$LOG_FILE"
          : > "$DETAIL_LOG"

          exec > >(tee -a "$LOG_FILE") 2>&1

          trap 'rc=$?; echo "ERROR: command failed at line $LINENO with exit code $rc"; exit $rc' ERR

          echo "========== START =========="
          date -u
          echo "PWD=$(pwd)"
          echo "GITHUB_WORKSPACE=${GITHUB_WORKSPACE:-}"
          echo "ENV=${ENV:-}"
          echo "SQL_ROOT=${SQL_ROOT:-}"

          echo "SNOWFLAKE_ACCOUNT set? $([[ -n "${SNOWFLAKE_ACCOUNT:-}" ]] && echo yes || echo no)"
          echo "SNOWFLAKE_USERNAME set? $([[ -n "${SNOWFLAKE_USERNAME:-}" ]] && echo yes || echo no)"
          echo "SNOWFLAKE_ROLE set? $([[ -n "${SNOWFLAKE_ROLE:-}" ]] && echo yes || echo no)"
          echo "SNOWFLAKE_WAREHOUSE set? $([[ -n "${SNOWFLAKE_WAREHOUSE:-}" ]] && echo yes || echo no)"
          echo "SNOWFLAKE_DATABASE set? $([[ -n "${SNOWFLAKE_DATABASE:-}" ]] && echo yes || echo no)"
          echo "SNOWFLAKE_SCHEMA set? $([[ -n "${SNOWFLAKE_SCHEMA:-}" ]] && echo yes || echo no)"
          echo "SNOWFLAKE_PRIVATE_KEY_PATH=${SNOWFLAKE_PRIVATE_KEY_PATH:-missing}"

          echo "========== CHANGED FILES =========="
          cat changed_files.txt || true

          echo "========== FILE CHECK =========="
          ls -la
          test -n "${SNOWFLAKE_PRIVATE_KEY_PATH:-}"
          test -f "${SNOWFLAKE_PRIVATE_KEY_PATH}"
          ls -l "${SNOWFLAKE_PRIVATE_KEY_PATH}"

          echo "========== SNOWSQL CHECK =========="
          which snowsql
          snowsql --version

          if [[ -z "${SES_SMTP_USERNAME:-}" || -z "${SES_SMTP_PASSWORD:-}" || -z "${SES_EMAIL_REGION:-}" || -z "${SES_EMAIL_SENDER:-}" || -z "${SES_EMAIL_RECIPIENTS:-}" ]]; then
            echo "SES SMTP configuration is incomplete." >&2
            exit 1
          fi

          snowsql_base=(
            snowsql
            -a "$SNOWFLAKE_ACCOUNT"
            -u "$SNOWFLAKE_USERNAME"
            -r "$SNOWFLAKE_ROLE"
            -w "$SNOWFLAKE_WAREHOUSE"
            -d "$SNOWFLAKE_DATABASE"
            -s "$SNOWFLAKE_SCHEMA"
            --private-key-path "$SNOWFLAKE_PRIVATE_KEY_PATH"
            -o exit_on_error=true
            -o friendly=false
            -o output_format=tsv
            -o timing=true
          )

          echo "========== TEST CONNECTION =========="
          "${snowsql_base[@]}" -q "SELECT CURRENT_USER(), CURRENT_ROLE(), CURRENT_DATABASE(), CURRENT_SCHEMA();"

          echo "========== SET SESSION CONTEXT =========="
          "${snowsql_base[@]}" -q "USE ROLE ${SNOWFLAKE_ROLE}; USE WAREHOUSE ${SNOWFLAKE_WAREHOUSE}; USE DATABASE ${SNOWFLAKE_DATABASE}; USE SCHEMA ${SNOWFLAKE_SCHEMA};"

          successes=()
          failures=()

          echo "========== EXECUTING FILES =========="
          while IFS= read -r f; do
            [[ -z "$f" ]] && continue
            rel="${f#./}"

            echo "---- Executing file: ${rel}" | tee -a "$DETAIL_LOG"
            test -f "$rel"

            echo "----- FILE PREVIEW (${rel}) -----" | tee -a "$DETAIL_LOG"
            sed -n '1,80p' "$rel" | tee -a "$DETAIL_LOG"
            echo "----- END PREVIEW (${rel}) -----" | tee -a "$DETAIL_LOG"

            if out=$("${snowsql_base[@]}" -f "$rel" 2>&1); then
              successes+=("$rel")
              echo "SUCCESS OUTPUT:" | tee -a "$DETAIL_LOG"
              printf '%s\n' "$out" | tee -a "$DETAIL_LOG"
            else
              failures+=("$rel")
              echo "ERROR OUTPUT:" | tee -a "$DETAIL_LOG"
              printf '%s\n' "$out" | tee -a "$DETAIL_LOG"
            fi

            echo | tee -a "$DETAIL_LOG"
          done < changed_files.txt

          ok_count=${#successes[@]}
          fail_count=${#failures[@]}

          echo "========== SUMMARY =========="
          echo "Succeeded: ${ok_count}"
          echo "Failed: ${fail_count}"

          if (( ok_count > 0 )); then
            printf 'Succeeded files:\n - %s\n' "${successes[@]}"
          fi

          if (( fail_count > 0 )); then
            printf 'Failed files:\n - %s\n' "${failures[@]}"
          fi

          {
            echo "__SUMMARY__"
            echo "SUCCESS_COUNT=${ok_count}"
            echo "FAIL_COUNT=${fail_count}"
          } >> "$DETAIL_LOG"

          subject="Snowflake deploy (${ENV}) ✔ ${ok_count} ok / ✖ ${fail_count} failed"

          {
            echo "Environment: ${ENV}"
            echo "Database.Schema: ${SNOWFLAKE_DATABASE}.${SNOWFLAKE_SCHEMA}"
            echo "Warehouse: ${SNOWFLAKE_WAREHOUSE}"
            echo
            echo "Succeeded (${ok_count}):"
            if (( ok_count > 0 )); then
              printf ' - %s\n' "${successes[@]}"
            else
              echo " - (none)"
            fi
            echo
            echo "Failed (${fail_count}):"
            if (( fail_count > 0 )); then
              printf ' - %s\n' "${failures[@]}"
            else
              echo " - (none)"
            fi
            echo
            echo "===== DETAIL ====="
            cat "$DETAIL_LOG"
          } > email_message.txt

          EMAIL_SUBJECT="$subject" python - <<'PY'
          import os
          import smtplib
          import sys
          from email.mime.text import MIMEText

          try:
              username = os.environ["SES_SMTP_USERNAME"]
              password = os.environ["SES_SMTP_PASSWORD"]
              region = os.environ["SES_EMAIL_REGION"]
              sender = os.environ["SES_EMAIL_SENDER"]
              recipients_raw = os.environ["SES_EMAIL_RECIPIENTS"]
              subject = os.environ["EMAIL_SUBJECT"]

              recipients = [addr.strip() for addr in recipients_raw.split(",") if addr.strip()]
              if not recipients:
                  raise ValueError("SES_EMAIL_RECIPIENTS does not contain any valid recipients.")

              with open("email_message.txt", "r", encoding="utf-8") as payload:
                  body = payload.read()

              message = MIMEText(body, "plain")
              message["Subject"] = subject
              message["From"] = sender
              message["To"] = ", ".join(recipients)

              smtp_endpoint = f"email-smtp.{region}.amazonaws.com"
              with smtplib.SMTP(smtp_endpoint, 587) as client:
                  client.starttls()
                  client.login(username, password)
                  client.sendmail(sender, recipients, message.as_string())
          except Exception as exc:
              print(f"Failed to send SES email notification: {exc}", file=sys.stderr)
              sys.exit(1)
          PY

          echo "Execution completed. Summary:"
          echo "Succeeded: ${ok_count} files"
          echo "Failed: ${fail_count} files"

          if (( fail_count > 0 )); then
            echo "Some SQL files failed to execute."
            exit 1
          fi

      - name: Upload logs as workflow artifact
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: snowflake-deploy-logs
          path: |
            workflow_bootstrap.log
            snowflake_deploy_full.log
            snow_exec_detail.log
            changed_files.txt
            deploy.sql
            email_message.txt
          if-no-files-found: warn

      - name: Upload deployment logs to S3
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${S3_LOG_BUCKET_URI:-}" ]]; then
            echo "S3_LOG_BUCKET_URI is not set, skipping S3 upload."
            exit 0
          fi

          ts="$(date -u +%Y%m%dT%H%M%SZ)"
          run_id="${GITHUB_RUN_ID:-unknown}"
          sha="${GITHUB_SHA:-unknown}"
          attempt="${GITHUB_RUN_ATTEMPT:-1}"
          ref_name="${GITHUB_REF_NAME:-unknown}"

          mkdir -p log_bundle
          cp -f snowflake_deploy_full.log log_bundle/ 2>/dev/null || true
          cp -f snow_exec_detail.log log_bundle/ 2>/dev/null || true
          cp -f workflow_bootstrap.log log_bundle/ 2>/dev/null || true
          cp -f changed_files.txt log_bundle/ 2>/dev/null || true
          cp -f deploy.sql log_bundle/ 2>/dev/null || true
          cp -f email_message.txt log_bundle/ 2>/dev/null || true

          tar -czf "snowflake-deploy-logs-${ts}.tar.gz" log_bundle

          s3_key="${S3_LOG_BUCKET_URI%/}/deploy/${ENV}/${ref_name}/run-${run_id}-attempt-${attempt}-${sha}-${ts}.tar.gz"

          echo "Uploading logs to: ${s3_key}"
          aws s3 cp "snowflake-deploy-logs-${ts}.tar.gz" "${s3_key}"
          echo "Uploaded logs successfully."
 
