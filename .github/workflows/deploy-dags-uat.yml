name: Airflow DAG Publish (uat)

on:
  push:
    branches: [uat]
    paths:
      - "DAGS_DIR/**"
      - ".github/workflows/deploy-dags-uat.yml"

concurrency:
  group: airflow-dags-${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

env:
  ENV: uat
  DAGS_ROOT: DAGS_DIR
  DAG_LOG_FILE: airflow_dags_sync.log
  CHANGED_DAGS_FILE: changed_dags.txt

jobs:
  publish-dags:
    runs-on: [self-hosted, Linux, X64]
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Export DAG deployment settings (uat)
        shell: bash
        run: |
          {
            echo "AIRFLOW_DAGS_S3_URI=${{ secrets.AIRFLOW_DAGS_S3_URI_UAT }}"
          } >> "$GITHUB_ENV"

      - name: Check AWS CLI
        shell: bash
        run: |
          set -euo pipefail
          which aws
          aws --version

      - name: List changed DAG files
        id: diff
        shell: bash
        run: |
          set -euo pipefail

          if [[ -n "${{ github.event.before }}" && "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]]; then
            range="${{ github.event.before }}..${{ github.sha }}"
            pathspec=":(glob)${DAGS_ROOT%/}/**"
            git diff --name-only --diff-filter=ACMRD "$range" -- "$pathspec" | sed '/^[[:space:]]*$/d' > "${CHANGED_DAGS_FILE}"
          else
            pathspec=":(glob)${DAGS_ROOT%/}/**"
            git diff-tree --no-commit-id --name-only -r "${GITHUB_SHA}" -- "$pathspec" | sed '/^[[:space:]]*$/d' > "${CHANGED_DAGS_FILE}"
          fi

          echo "==== ${CHANGED_DAGS_FILE} ===="
          cat "${CHANGED_DAGS_FILE}" || true

          if [[ -s "${CHANGED_DAGS_FILE}" ]] && grep -q '[^[:space:]]' "${CHANGED_DAGS_FILE}"; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            : > "${CHANGED_DAGS_FILE}"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate DAG deployment target
        if: ${{ steps.diff.outputs.changed == 'true' }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! -d "${DAGS_ROOT}" ]]; then
            echo "DAG source directory '${DAGS_ROOT}' does not exist." >&2
            exit 1
          fi

          if [[ -z "${AIRFLOW_DAGS_S3_URI:-}" ]]; then
            echo "AIRFLOW_DAGS_S3_URI is not configured." >&2
            exit 1
          fi

          if [[ "${AIRFLOW_DAGS_S3_URI}" != s3://* ]]; then
            echo "AIRFLOW_DAGS_S3_URI must start with s3:// but got '${AIRFLOW_DAGS_S3_URI}'." >&2
            exit 1
          fi

      - name: Exit early (no changed DAG files)
        if: ${{ steps.diff.outputs.changed == 'false' }}
        shell: bash
        run: |
          echo "No DAG changes under ${DAGS_ROOT}; nothing to publish." | tee "${DAG_LOG_FILE}"

      - name: Sync DAGs to S3
        if: ${{ steps.diff.outputs.changed == 'true' }}
        shell: bash
        run: |
          set -euo pipefail

          : > "${DAG_LOG_FILE}"
          exec > >(tee -a "${DAG_LOG_FILE}") 2>&1

          echo "========== START =========="
          date -u
          echo "ENV=${ENV}"
          echo "DAGS_ROOT=${DAGS_ROOT}"
          echo "AIRFLOW_DAGS_S3_URI=${AIRFLOW_DAGS_S3_URI}"

          echo "========== CHANGED FILES =========="
          cat "${CHANGED_DAGS_FILE}" || true

          echo "========== SYNC =========="
          aws s3 sync "${DAGS_ROOT}/" "${AIRFLOW_DAGS_S3_URI}" \
            --delete \
            --exclude "__pycache__/*" \
            --exclude "*.pyc" \
            --exclude ".gitkeep"

          echo "========== DONE =========="

      - name: Upload DAG deployment logs as workflow artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: airflow-dags-uat-logs
          path: |
            changed_dags.txt
            airflow_dags_sync.log
          if-no-files-found: warn
 
