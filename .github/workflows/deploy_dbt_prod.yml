name: DBT Prod - Print configured things (dry run)

on:
  workflow_dispatch:
  push:
    branches: [dbt_prod]
    paths:
      - "MAXI_RAW/POC_DBT/bagic_ontology_test/**"

env:
  ENV: prod
  DBT_PROJECT_DIR: MAXI_RAW/POC_DBT/bagic_ontology_test
  DBT_OBJECT_NAME: bagic_ontology_dbt_prod
  DBT_VERSION: "1.10.15"
  DBT_TARGET: prod
  SNOWFLAKE_CLI_FEATURES_ENABLE_DBT: "true"
  SNOWFLAKE_CLI_FEATURES_ENABLE_DBT_VERSION: "true"
  # Single combined log file for every step
  RUN_LOG: dbt_run.log
  # Hardcoded S3 destination (base bucket + prefix). Uses the dev folder as requested.
  S3_LOG_BASE_URI: s3://bagic-dpm-prod-artifact/Github_logs/deploy/dev/dev

jobs:
  inspect:
    runs-on: [self-hosted, Linux, X64]
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Initialize combined run log
        shell: bash
        run: |
          set -euo pipefail
          : > "${RUN_LOG}"
          {
            echo "########## RUN LOG START ##########"
            date -u
            echo "Workflow=${GITHUB_WORKFLOW:-unknown}"
            echo "Run ID=${GITHUB_RUN_ID:-unknown}"
            echo "Run attempt=${GITHUB_RUN_ATTEMPT:-unknown}"
            echo "Ref Name=${GITHUB_REF_NAME:-unknown}"
            echo "SHA=${GITHUB_SHA:-unknown}"
          } | tee -a "${RUN_LOG}"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Ensure Snowflake CLI
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee -a "${RUN_LOG}") 2>&1
          echo "===== STEP: Ensure Snowflake CLI ====="
          if command -v snow >/dev/null 2>&1; then
            echo "Snowflake CLI already available on runner:"
            snow --version
            exit 0
          fi
          echo "Installing Snowflake CLI via pip"
          python -m pip install --upgrade pip
          python -m pip install --upgrade snowflake-cli
          snow --version

      - name: Export Snowflake creds from GitHub Secrets (PROD)
        shell: bash
        run: |
          set -euo pipefail
          echo "===== STEP: Export Snowflake creds (values masked in this step) =====" | tee -a "${RUN_LOG}"
          {
            echo "SNOWFLAKE_ACCOUNT=${{ secrets.SNOWFLAKE_ACCOUNT_PROD }}"
            echo "SNOWFLAKE_USER=${{ secrets.SNOWFLAKE_USERNAME_PROD }}"
            echo "SNOWFLAKE_ROLE=${{ secrets.SNOWFLAKE_ROLE_PROD }}"
            echo "SNOWFLAKE_WAREHOUSE=${{ secrets.SNOWFLAKE_WAREHOUSE_PROD }}"
            echo "SNOWFLAKE_DATABASE=${{ secrets.SNOWFLAKE_DATABASE_PROD }}"
            echo "SNOWFLAKE_SCHEMA=${{ secrets.SNOWFLAKE_SCHEMA_PROD }}"
            echo "SNOWFLAKE_PRIVATE_KEY_URI=${{ secrets.SNOWFLAKE_PRIVATE_KEY_URI_PROD }}"
            echo "SNOWFLAKE_PRIVATE_KEY_PASSPHRASE=${{ secrets.SNOWFLAKE_PRIVATE_KEY_PASSPHRASE_PROD }}"
            echo "SNOWFLAKE_PASSWORD=${{ secrets.SNOWFLAKE_PASSWORD_PROD }}"
            echo "SES_EMAIL_RECIPIENTS=${{ secrets.SNOWFLAKE_DEPLOY_EMAIL_RECIPIENTS_PROD }}"
            echo "SES_EMAIL_SENDER=${{ secrets.SNOWFLAKE_DEPLOY_EMAIL_SENDER_PROD }}"
            echo "SES_EMAIL_REGION=${{ secrets.SNOWFLAKE_DEPLOY_SES_REGION_PROD }}"
            echo "SES_SMTP_USERNAME=${{ secrets.SNOWFLAKE_DEPLOY_SES_SMTP_USERNAME_PROD }}"
            echo "SES_SMTP_PASSWORD=${{ secrets.SNOWFLAKE_DEPLOY_SES_SMTP_PASSWORD_PROD }}"
            echo "DEPLOY_LOG_S3_URI=${{ secrets.SNOWFLAKE_DEPLOY_LOG_S3_URI_PROD }}"
            echo "AIRFLOW_DAGS_S3_URI=${{ secrets.AIRFLOW_DAGS_S3_URI_PROD }}"
            echo "SNOWFLAKE_BLOCKED_DATABASES=${{ secrets.SNOWFLAKE_BLOCKED_DATABASES }}"
          } >> "$GITHUB_ENV"

      - name: Download Snowflake private key from S3
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee -a "${RUN_LOG}") 2>&1
          echo "===== STEP: Download Snowflake private key ====="
          if [[ -z "${SNOWFLAKE_PRIVATE_KEY_URI:-}" ]]; then
            echo "SNOWFLAKE_PRIVATE_KEY_URI secret is not configured" >&2
            exit 1
          fi

          aws s3 cp "$SNOWFLAKE_PRIVATE_KEY_URI" snowflake_rsa_key.p8
          chmod 600 snowflake_rsa_key.p8

          if grep -q "ENCRYPTED" snowflake_rsa_key.p8; then
            if [[ -z "${SNOWFLAKE_PRIVATE_KEY_PASSPHRASE:-}" ]]; then
              echo "The downloaded Snowflake private key is encrypted but SNOWFLAKE_PRIVATE_KEY_PASSPHRASE_PROD is empty." >&2
              exit 1
            fi
            openssl pkcs8 \
              -in snowflake_rsa_key.p8 \
              -topk8 \
              -nocrypt \
              -passin env:SNOWFLAKE_PRIVATE_KEY_PASSPHRASE \
              -out snowflake_rsa_key_decrypted.p8
            chmod 600 snowflake_rsa_key_decrypted.p8
            echo "SNOWFLAKE_PRIVATE_KEY_PATH=${PWD}/snowflake_rsa_key_decrypted.p8" >> "$GITHUB_ENV"
          else
            echo "SNOWFLAKE_PRIVATE_KEY_PATH=${PWD}/snowflake_rsa_key.p8" >> "$GITHUB_ENV"
          fi

      - name: Print diagnostics (config, variables, connection, user)
        shell: bash
        run: |
          set -uo pipefail
          exec > >(tee -a "${RUN_LOG}") 2>&1
          echo "===== STEP: Print diagnostics ====="

          echo "========== GITHUB CONTEXT =========="
          echo "Workflow=${GITHUB_WORKFLOW:-unknown}"
          echo "Run ID=${GITHUB_RUN_ID:-unknown}"
          echo "Run attempt=${GITHUB_RUN_ATTEMPT:-unknown}"
          echo "Ref Name=${GITHUB_REF_NAME:-unknown}"
          echo "SHA=${GITHUB_SHA:-unknown}"
          echo "Actor=${GITHUB_ACTOR:-unknown}"
          echo "Workspace=${GITHUB_WORKSPACE:-unknown}"

          echo "========== WORKFLOW ENV (non-secret) =========="
          echo "ENV=${ENV:-}"
          echo "DBT_PROJECT_DIR=${DBT_PROJECT_DIR:-}"
          echo "DBT_OBJECT_NAME=${DBT_OBJECT_NAME:-}"
          echo "DBT_VERSION=${DBT_VERSION:-}"
          echo "DBT_TARGET=${DBT_TARGET:-}"
          echo "SNOWFLAKE_CLI_FEATURES_ENABLE_DBT=${SNOWFLAKE_CLI_FEATURES_ENABLE_DBT:-}"
          echo "SNOWFLAKE_CLI_FEATURES_ENABLE_DBT_VERSION=${SNOWFLAKE_CLI_FEATURES_ENABLE_DBT_VERSION:-}"

          echo "========== SNOWFLAKE CONNECTION VARIABLES =========="
          echo "SNOWFLAKE_ACCOUNT=${SNOWFLAKE_ACCOUNT:-<empty>}"
          echo "SNOWFLAKE_USER=${SNOWFLAKE_USER:-<empty>}"
          echo "SNOWFLAKE_ROLE=${SNOWFLAKE_ROLE:-<empty>}"
          echo "SNOWFLAKE_WAREHOUSE=${SNOWFLAKE_WAREHOUSE:-<empty>}"
          echo "SNOWFLAKE_DATABASE=${SNOWFLAKE_DATABASE:-<empty>}"
          echo "SNOWFLAKE_SCHEMA=${SNOWFLAKE_SCHEMA:-<empty>}"
          echo "SNOWFLAKE_PRIVATE_KEY_URI=${SNOWFLAKE_PRIVATE_KEY_URI:-<empty>}"
          echo "SNOWFLAKE_PRIVATE_KEY_PATH=${SNOWFLAKE_PRIVATE_KEY_PATH:-<missing>}"
          echo "SNOWFLAKE_PRIVATE_KEY_PASSPHRASE set? $([[ -n "${SNOWFLAKE_PRIVATE_KEY_PASSPHRASE:-}" ]] && echo yes || echo no)"

          echo "========== SES / S3 / OTHER VARIABLES =========="
          echo "SES_EMAIL_RECIPIENTS=${SES_EMAIL_RECIPIENTS:-<empty>}"
          echo "SES_EMAIL_SENDER=${SES_EMAIL_SENDER:-<empty>}"
          echo "SES_EMAIL_REGION=${SES_EMAIL_REGION:-<empty>}"
          echo "SES_SMTP_USERNAME=${SES_SMTP_USERNAME:-<empty>}"
          echo "DEPLOY_LOG_S3_URI=${DEPLOY_LOG_S3_URI:-<empty>}"
          echo "AIRFLOW_DAGS_S3_URI=${AIRFLOW_DAGS_S3_URI:-<empty>}"
          echo "SNOWFLAKE_BLOCKED_DATABASES=${SNOWFLAKE_BLOCKED_DATABASES:-<empty>}"

          echo "========== SECRETS PRESENCE (passwords never printed) =========="
          echo "SNOWFLAKE_PASSWORD set? $([[ -n "${SNOWFLAKE_PASSWORD:-}" ]] && echo yes || echo no)"
          echo "SNOWFLAKE_PRIVATE_KEY_PASSPHRASE set? $([[ -n "${SNOWFLAKE_PRIVATE_KEY_PASSPHRASE:-}" ]] && echo yes || echo no)"
          echo "SES_SMTP_PASSWORD set? $([[ -n "${SES_SMTP_PASSWORD:-}" ]] && echo yes || echo no)"

          echo "========== FILE / PROJECT CHECK =========="
          echo "PWD=$(pwd)"
          echo "Project dir exists? $([[ -d "${DBT_PROJECT_DIR}" ]] && echo yes || echo no)"
          test -f "${DBT_PROJECT_DIR}/dbt_project.yml" && echo "dbt_project.yml found" || echo "dbt_project.yml MISSING"
          test -f "${DBT_PROJECT_DIR}/profiles.yml" && echo "profiles.yml found" || echo "profiles.yml MISSING"
          [[ -n "${SNOWFLAKE_PRIVATE_KEY_PATH:-}" && -f "${SNOWFLAKE_PRIVATE_KEY_PATH}" ]] && echo "Private key file present" || echo "Private key file NOT present"

          echo "========== SNOW CLI =========="
          if command -v snow >/dev/null 2>&1; then
            which snow
            snow --version
          else
            echo "snow CLI not found on PATH"
          fi

          echo "========== SNOWFLAKE CONNECTION TEST =========="
          export SNOWFLAKE_AUTHENTICATOR="SNOWFLAKE_JWT"
          if command -v snow >/dev/null 2>&1; then
            snow connection test -x || echo "WARNING: snow connection test failed (review variables above)."
            echo "---- CURRENT_USER / ROLE / WAREHOUSE / DB / SCHEMA ----"
            snow sql -x -q "SELECT CURRENT_USER(), CURRENT_ROLE(), CURRENT_WAREHOUSE(), CURRENT_DATABASE(), CURRENT_SCHEMA();" \
              || echo "WARNING: snow sql identity query failed."
          else
            echo "Skipping connection test; snow CLI unavailable."
          fi

          echo "========== END DIAGNOSTICS =========="

      - name: Print ALL configured secrets (DEV / PROD / UAT / shared)
        shell: bash
        run: |
          set -uo pipefail
          exec > >(tee -a "${RUN_LOG}") 2>&1
          echo "===== STEP: Print ALL configured secrets ====="
          echo "NOTE: credential secrets (passwords / passphrases) are shown as set? yes/no only."

          echo "---------- SNOWFLAKE_ACCOUNT ----------"
          echo "DEV=${{ secrets.SNOWFLAKE_ACCOUNT_DEV }}"
          echo "PROD=${{ secrets.SNOWFLAKE_ACCOUNT_PROD }}"
          echo "UAT=${{ secrets.SNOWFLAKE_ACCOUNT_UAT }}"

          echo "---------- SNOWFLAKE_USERNAME ----------"
          echo "DEV=${{ secrets.SNOWFLAKE_USERNAME_DEV }}"
          echo "PROD=${{ secrets.SNOWFLAKE_USERNAME_PROD }}"
          echo "UAT=${{ secrets.SNOWFLAKE_USERNAME_UAT }}"

          echo "---------- SNOWFLAKE_ROLE ----------"
          echo "DEV=${{ secrets.SNOWFLAKE_ROLE_DEV }}"
          echo "PROD=${{ secrets.SNOWFLAKE_ROLE_PROD }}"
          echo "UAT=${{ secrets.SNOWFLAKE_ROLE_UAT }}"

          echo "---------- SNOWFLAKE_WAREHOUSE ----------"
          echo "DEV=${{ secrets.SNOWFLAKE_WAREHOUSE_DEV }}"
          echo "PROD=${{ secrets.SNOWFLAKE_WAREHOUSE_PROD }}"
          echo "UAT=${{ secrets.SNOWFLAKE_WAREHOUSE_UAT }}"

          echo "---------- SNOWFLAKE_DATABASE ----------"
          echo "DEV=${{ secrets.SNOWFLAKE_DATABASE_DEV }}"
          echo "PROD=${{ secrets.SNOWFLAKE_DATABASE_PROD }}"
          echo "UAT=${{ secrets.SNOWFLAKE_DATABASE_UAT }}"

          echo "---------- SNOWFLAKE_SCHEMA ----------"
          echo "DEV=${{ secrets.SNOWFLAKE_SCHEMA_DEV }}"
          echo "PROD=${{ secrets.SNOWFLAKE_SCHEMA_PROD }}"
          echo "UAT=${{ secrets.SNOWFLAKE_SCHEMA_UAT }}"

          echo "---------- SNOWFLAKE_PRIVATE_KEY_URI ----------"
          echo "DEV=${{ secrets.SNOWFLAKE_PRIVATE_KEY_URI_DEV }}"
          echo "PROD=${{ secrets.SNOWFLAKE_PRIVATE_KEY_URI_PROD }}"
          echo "UAT=${{ secrets.SNOWFLAKE_PRIVATE_KEY_URI_UAT }}"

          echo "---------- AIRFLOW_DAGS_S3_URI ----------"
          echo "DEV=${{ secrets.AIRFLOW_DAGS_S3_URI_DEV }}"
          echo "PROD=${{ secrets.AIRFLOW_DAGS_S3_URI_PROD }}"
          echo "UAT=${{ secrets.AIRFLOW_DAGS_S3_URI_UAT }}"

          echo "---------- SNOWFLAKE_DEPLOY_LOG_S3_URI ----------"
          echo "DEV=${{ secrets.SNOWFLAKE_DEPLOY_LOG_S3_URI_DEV }}"
          echo "PROD=${{ secrets.SNOWFLAKE_DEPLOY_LOG_S3_URI_PROD }}"
          echo "UAT=${{ secrets.SNOWFLAKE_DEPLOY_LOG_S3_URI_UAT }}"
          echo "VALIDATION=${{ secrets.SNOWFLAKE_DEPLOY_LOG_S3_URI_VALIDATION }}"

          echo "---------- SNOWFLAKE_DEPLOY_EMAIL_RECIPIENTS ----------"
          echo "DEV=${{ secrets.SNOWFLAKE_DEPLOY_EMAIL_RECIPIENTS_DEV }}"
          echo "PROD=${{ secrets.SNOWFLAKE_DEPLOY_EMAIL_RECIPIENTS_PROD }}"
          echo "UAT=${{ secrets.SNOWFLAKE_DEPLOY_EMAIL_RECIPIENTS_UAT }}"

          echo "---------- SNOWFLAKE_DEPLOY_EMAIL_SENDER ----------"
          echo "DEV=${{ secrets.SNOWFLAKE_DEPLOY_EMAIL_SENDER_DEV }}"
          echo "PROD=${{ secrets.SNOWFLAKE_DEPLOY_EMAIL_SENDER_PROD }}"
          echo "UAT=${{ secrets.SNOWFLAKE_DEPLOY_EMAIL_SENDER_UAT }}"

          echo "---------- SNOWFLAKE_DEPLOY_SES_REGION ----------"
          echo "DEV=${{ secrets.SNOWFLAKE_DEPLOY_SES_REGION_DEV }}"
          echo "PROD=${{ secrets.SNOWFLAKE_DEPLOY_SES_REGION_PROD }}"
          echo "UAT=${{ secrets.SNOWFLAKE_DEPLOY_SES_REGION_UAT }}"

          echo "---------- SNOWFLAKE_DEPLOY_SES_SMTP_USERNAME ----------"
          echo "DEV=${{ secrets.SNOWFLAKE_DEPLOY_SES_SMTP_USERNAME_DEV }}"
          echo "PROD=${{ secrets.SNOWFLAKE_DEPLOY_SES_SMTP_USERNAME_PROD }}"
          echo "UAT=${{ secrets.SNOWFLAKE_DEPLOY_SES_SMTP_USERNAME_UAT }}"

          echo "---------- SHARED ----------"
          echo "SNOWFLAKE_BLOCKED_DATABASES=${{ secrets.SNOWFLAKE_BLOCKED_DATABASES }}"

          echo "---------- CREDENTIALS (presence only, never printed) ----------"
          echo "SNOWFLAKE_PASSWORD_DEV set? $([[ -n "${{ secrets.SNOWFLAKE_PASSWORD_DEV }}" ]] && echo yes || echo no)"
          echo "SNOWFLAKE_PASSWORD_PROD set? $([[ -n "${{ secrets.SNOWFLAKE_PASSWORD_PROD }}" ]] && echo yes || echo no)"
          echo "SNOWFLAKE_PASSWORD_UAT set? $([[ -n "${{ secrets.SNOWFLAKE_PASSWORD_UAT }}" ]] && echo yes || echo no)"
          echo "SNOWFLAKE_PRIVATE_KEY_PASSPHRASE_DEV set? $([[ -n "${{ secrets.SNOWFLAKE_PRIVATE_KEY_PASSPHRASE_DEV }}" ]] && echo yes || echo no)"
          echo "SNOWFLAKE_PRIVATE_KEY_PASSPHRASE_PROD set? $([[ -n "${{ secrets.SNOWFLAKE_PRIVATE_KEY_PASSPHRASE_PROD }}" ]] && echo yes || echo no)"
          echo "SNOWFLAKE_PRIVATE_KEY_PASSPHRASE_UAT set? $([[ -n "${{ secrets.SNOWFLAKE_PRIVATE_KEY_PASSPHRASE_UAT }}" ]] && echo yes || echo no)"
          echo "SES_SMTP_PASSWORD_DEV set? $([[ -n "${{ secrets.SNOWFLAKE_DEPLOY_SES_SMTP_PASSWORD_DEV }}" ]] && echo yes || echo no)"
          echo "SES_SMTP_PASSWORD_PROD set? $([[ -n "${{ secrets.SNOWFLAKE_DEPLOY_SES_SMTP_PASSWORD_PROD }}" ]] && echo yes || echo no)"
          echo "SES_SMTP_PASSWORD_UAT set? $([[ -n "${{ secrets.SNOWFLAKE_DEPLOY_SES_SMTP_PASSWORD_UAT }}" ]] && echo yes || echo no)"

          echo "===== END Print ALL configured secrets ====="

      - name: Upload combined log to S3
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "########## RUN LOG END ##########"
            date -u
          } >> "${RUN_LOG}"

          ts="$(date -u +%Y%m%dT%H%M%SZ)"
          run_id="${GITHUB_RUN_ID:-unknown}"
          attempt="${GITHUB_RUN_ATTEMPT:-1}"
          sha="${GITHUB_SHA:-unknown}"

          dest="${S3_LOG_BASE_URI%/}/dbt_run-${run_id}-attempt-${attempt}-${sha}-${ts}.log"

          echo "Uploading combined log to: ${dest}"
          aws s3 cp "${RUN_LOG}" "${dest}"
          echo "Uploaded successfully."
