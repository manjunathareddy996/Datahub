name: Runner Diagnostics

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/runner_diagnostics.yml"

env:
  # Single combined log file for every step
  RUN_LOG: runner_info.log
  # Dev S3 destination for the runner diagnostics log
  S3_LOG_BASE_URI: s3://bagic-dpm-prod-artifact/Github_logs/deploy/dev/dev

jobs:
  diagnose:
    runs-on: [self-hosted, Linux, X64]
    permissions:
      contents: read

    steps:
      - name: Initialize combined run log
        shell: bash
        run: |
          set -uo pipefail
          : > "${RUN_LOG}"
          {
            echo "########## RUNNER INFO LOG START ##########"
            date -u
            echo "Workflow=${GITHUB_WORKFLOW:-unknown}"
            echo "Run ID=${GITHUB_RUN_ID:-unknown}"
            echo "Run attempt=${GITHUB_RUN_ATTEMPT:-unknown}"
            echo "Ref Name=${GITHUB_REF_NAME:-unknown}"
            echo "SHA=${GITHUB_SHA:-unknown}"
          } | tee -a "${RUN_LOG}"

      - name: Runner / host identity
        shell: bash
        run: |
          set -uo pipefail
          exec > >(tee -a "${RUN_LOG}") 2>&1
          echo "===== RUNNER / HOST IDENTITY ====="
          echo "Hostname: $(hostname)"
          echo "Runner name: ${RUNNER_NAME:-unknown}"
          echo "Runner OS/arch: ${RUNNER_OS:-?}/${RUNNER_ARCH:-?}"
          echo "Whoami: $(whoami)"
          echo "Uname: $(uname -a)"
          echo "--- /etc/os-release ---"
          cat /etc/os-release 2>/dev/null || echo "n/a"

      - name: EC2 instance metadata (IMDSv2 then v1)
        shell: bash
        run: |
          set -uo pipefail
          exec > >(tee -a "${RUN_LOG}") 2>&1
          echo "===== EC2 INSTANCE METADATA ====="
          # IMDSv2 (token-based)
          TOKEN="$(curl -s -m 3 -X PUT "http://169.254.169.254/latest/api/token" \
            -H "X-aws-ec2-metadata-token-ttl-seconds: 60" 2>/dev/null || true)"

          imds() {
            local path="$1"
            if [[ -n "${TOKEN}" ]]; then
              curl -s -m 3 -H "X-aws-ec2-metadata-token: ${TOKEN}" "http://169.254.169.254/latest/${path}" 2>/dev/null
            else
              curl -s -m 3 "http://169.254.169.254/latest/${path}" 2>/dev/null
            fi
          }

          echo "Instance ID:   $(imds meta-data/instance-id)"
          echo "Instance type: $(imds meta-data/instance-type)"
          echo "Private IP:    $(imds meta-data/local-ipv4)"
          echo "AZ:            $(imds meta-data/placement/availability-zone)"
          echo "Region:        $(imds meta-data/placement/region)"
          echo "AMI ID:        $(imds meta-data/ami-id)"
          echo "--- Name tag (requires IMDS tags enabled) ---"
          echo "Name: $(imds meta-data/tags/instance/Name)"

      - name: AWS identity (if CLI + creds present)
        shell: bash
        run: |
          set -uo pipefail
          exec > >(tee -a "${RUN_LOG}") 2>&1
          echo "===== AWS IDENTITY ====="
          if command -v aws >/dev/null 2>&1; then
            aws sts get-caller-identity 2>&1 || echo "sts get-caller-identity failed (no/limited creds)."
            echo "--- describe own instance Name tag (needs ec2:DescribeInstances) ---"
            TOKEN="$(curl -s -m 3 -X PUT "http://169.254.169.254/latest/api/token" -H "X-aws-ec2-metadata-token-ttl-seconds: 60" 2>/dev/null || true)"
            IID="$(curl -s -m 3 -H "X-aws-ec2-metadata-token: ${TOKEN}" http://169.254.169.254/latest/meta-data/instance-id 2>/dev/null)"
            REGION="$(curl -s -m 3 -H "X-aws-ec2-metadata-token: ${TOKEN}" http://169.254.169.254/latest/meta-data/placement/region 2>/dev/null)"
            if [[ -n "${IID}" ]]; then
              aws ec2 describe-instances --instance-ids "${IID}" --region "${REGION:-ap-south-1}" \
                --query "Reservations[].Instances[].Tags" --output text 2>&1 || echo "describe-instances failed."
            fi
          else
            echo "aws CLI not found on runner."
          fi

      - name: DNS resolution checks
        shell: bash
        run: |
          set -uo pipefail
          exec > >(tee -a "${RUN_LOG}") 2>&1
          echo "===== DNS RESOLUTION ====="
          HOSTS=(
            "iz53102.ap-south-1.privatelink.snowflakecomputing.com"
            "ocsp.iz53102.ap-south-1.privatelink.snowflakecomputing.com"
            "s3.ap-south-1.amazonaws.com"
            "sfc-in-ds1-65-customer-stage.s3.ap-south-1.amazonaws.com"
            "ocsp.rootca1.amazontrust.com"
            "hub.getdbt.com"
          )
          for h in "${HOSTS[@]}"; do
            echo "---------- ${h} ----------"
            getent hosts "${h}" || nslookup "${h}" 2>&1 || echo "DNS FAILED: ${h}"
            echo
          done

      - name: Outbound connectivity checks (HTTPS/443)
        shell: bash
        run: |
          set -uo pipefail
          exec > >(tee -a "${RUN_LOG}") 2>&1
          echo "===== OUTBOUND HTTPS (443) ====="
          URLS=(
            "https://iz53102.ap-south-1.privatelink.snowflakecomputing.com"
            "https://s3.ap-south-1.amazonaws.com"
            "https://sfc-in-ds1-65-customer-stage.s3.ap-south-1.amazonaws.com"
          )
          for u in "${URLS[@]}"; do
            echo "---------- ${u} ----------"
            # -I head request, capture status + connect timing; do not fail the step
            curl -sS -o /dev/null -m 10 \
              -w "HTTP=%{http_code} dns=%{time_namelookup}s connect=%{time_connect}s total=%{time_total}s\n" \
              "${u}" 2>&1 || echo "CONNECT FAILED: ${u}"
            echo
          done

      - name: Verbose curl to failing internal-stage S3 endpoint
        shell: bash
        run: |
          set -uo pipefail
          exec > >(tee -a "${RUN_LOG}") 2>&1
          echo "===== VERBOSE CURL: failing Snowflake internal-stage S3 endpoint ====="
          FAIL_URL="https://sfc-in-ds1-65-customer-stage.s3.ap-south-1.amazonaws.com"
          echo "Target: ${FAIL_URL}"
          echo
          echo "---------- curl -v (TLS handshake + response headers + body) ----------"
          # -v: full verbose incl. TLS + request/response headers
          # --connect-timeout / -m: bound the probe
          # Do not fail the step regardless of HTTP status
          curl -v -sS -m 20 "${FAIL_URL}" 2>&1 || echo "CONNECT FAILED: ${FAIL_URL}"
          echo
          echo "---------- HEAD request with status/timing ----------"
          curl -v -sS -o /dev/null -m 20 -I \
            -w "HTTP=%{http_code} dns=%{time_namelookup}s connect=%{time_connect}s appconnect=%{time_appconnect}s total=%{time_total}s\n" \
            "${FAIL_URL}" 2>&1 || echo "HEAD FAILED: ${FAIL_URL}"
          echo
          echo "---------- simulated PUT (path like the dbt deploy upload) ----------"
          # Snowflake PUTs objects under /<account-prefix>/stages/<id>/...; we cannot use the
          # real signed URL, so this is expected to return 403/AccessDenied if egress is open,
          # or fail to connect / be proxy-rejected if egress is blocked. The distinction matters.
          curl -v -sS -m 20 -X PUT --data "diagnostic-probe" \
            "${FAIL_URL}/diagnostic-probe-object.txt" 2>&1 || echo "PUT PROBE FAILED: ${FAIL_URL}"

      - name: Proxy / egress environment
        shell: bash
        run: |
          set -uo pipefail
          exec > >(tee -a "${RUN_LOG}") 2>&1
          echo "===== PROXY / EGRESS ENV ====="
          echo "HTTP_PROXY=${HTTP_PROXY:-<unset>}"
          echo "HTTPS_PROXY=${HTTPS_PROXY:-<unset>}"
          echo "NO_PROXY=${NO_PROXY:-<unset>}"
          echo "http_proxy=${http_proxy:-<unset>}"
          echo "https_proxy=${https_proxy:-<unset>}"
          echo "no_proxy=${no_proxy:-<unset>}"
          echo "--- public egress IP (best effort) ---"
          curl -sS -m 8 https://checkip.amazonaws.com 2>&1 || echo "could not determine public egress IP"

      - name: Docker context (best effort)
        shell: bash
        run: |
          set -uo pipefail
          exec > >(tee -a "${RUN_LOG}") 2>&1
          echo "===== CONTAINER / DOCKER CONTEXT ====="
          echo "In container marker: $( [[ -f /.dockerenv ]] && echo yes || echo no )"
          echo "--- cgroup (hints at container id) ---"
          head -n 5 /proc/1/cgroup 2>/dev/null || echo "n/a"

      - name: Upload runner info log to S3
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "########## RUNNER INFO LOG END ##########"
            date -u
          } >> "${RUN_LOG}"

          ts="$(date -u +%Y%m%dT%H%M%SZ)"
          run_id="${GITHUB_RUN_ID:-unknown}"
          attempt="${GITHUB_RUN_ATTEMPT:-1}"
          sha="${GITHUB_SHA:-unknown}"

          dest="${S3_LOG_BASE_URI%/}/runner_info_logs-${run_id}-attempt-${attempt}-${sha}-${ts}.log"

          echo "Uploading runner info log to: ${dest}"
          aws s3 cp "${RUN_LOG}" "${dest}"
          echo "Uploaded successfully."
