version: 2

sources:
  - name: raw_opus
    description: "OPUS Partner & Member tables - relational source system"
    database: "{{ env_var('RAW_DATABASE', 'RAW_DB') }}"
    schema: "{{ env_var('OPUS_SCHEMA', 'OPUS_PARTNER') }}"
    tables:
      # ============================
      # CORE PARTNER TABLES
      # ============================
      - name: CP_PARTNERS
        description: "Core partner identity - name, DOB, gender, nationality (BK: PART_ID)"
        columns:
          - name: PART_ID
            description: "Business Key - unique partner identifier in OPUS"

      - name: CP_ADDRESSES
        description: "Partner address lines (joined via ADD_ID to CP_PARTNERS)"
        columns:
          - name: ADD_ID
            description: "Address ID - FK to CP_PARTNERS.ADD_ID"

      - name: AZBJ_PARTNER_EXTN
        description: "Partner extension - bank, KYC, family, employment details"
        columns:
          - name: PART_ID
            description: "FK to CP_PARTNERS.PART_ID"

      - name: AZBJ_ADDRESS_EXTN
        description: "Address extension - telephone, building, door, passport"
        columns:
          - name: ADD_ID
            description: "FK to CP_ADDRESSES.ADD_ID"

      # ============================
      # SUPPLIER / SURVEYOR / HOSPITAL
      # ============================
      - name: BJAZ_CLM_SUPP_EXTN
        description: "Claim supplier extension - surveyor, repairer, lawyer, dealer details"
        columns:
          - name: SUPP_ID
            description: "Supplier ID"
          - name: PARTNER_ID
            description: "FK to CP_PARTNERS.PART_ID"

      - name: CLM_SUPPLIERS
        description: "Claim supplier base - supplier type, status, location"
        columns:
          - name: SUPP_ID
            description: "Supplier ID - PK"
          - name: PART_ID
            description: "FK to CP_PARTNERS.PART_ID"

      - name: BJAZ_HM_HOSPITAL_MASTER
        description: "Hospital master - network, discount, empanelment, speciality"
        columns:
          - name: HOSID
            description: "Hospital ID - PK"
          - name: PARTNER_ID
            description: "FK to CP_PARTNERS.PART_ID"

      - name: BJAZ_INTERMEDIARY
        description: "Intermediary (agent) - license, channel, region, PAN, commission"
        columns:
          - name: INTERMEDIARY_ID
            description: "Intermediary ID - PK"
          - name: PARTNER_ID
            description: "FK to CP_PARTNERS.PART_ID"

      # ============================
      # HISTORY TABLES (SCD2 sources)
      # ============================
      - name: BJAZ_CP_PART_HIST
        description: "Partner history - versioned partner attributes"
        columns:
          - name: PART_ID
            description: "FK to CP_PARTNERS.PART_ID"

      - name: BJAZ_CP_ADD_HIST
        description: "Address history - versioned address attributes"
        columns:
          - name: ADD_ID
            description: "FK to CP_ADDRESSES.ADD_ID"

      - name: BJAZ_AZBJ_PART_EXT_HIST
        description: "Partner extension history - versioned partner extension"
        columns:
          - name: PART_ID
            description: "FK to CP_PARTNERS.PART_ID"

      - name: BJAZ_INTERMEDIARY_HIST
        description: "Intermediary history - versioned agent details"
        columns:
          - name: INTERMEDIARY_ID
            description: "Intermediary ID"
          - name: PARTNER_ID
            description: "FK to CP_PARTNERS.PART_ID"

      # ============================
      # MEMBER TABLES (policy-linked)
      # ============================
      - name: BA_HCP_DT_MEM
        description: "Health corporate member details (legacy BA table)"
        columns:
          - name: PART_ID
            description: "FK to CP_PARTNERS.PART_ID"
          - name: CONTRACT_ID
            description: "Policy contract ID"

      - name: BJAZ_HCF_MEMBER_DTLS
        description: "Health care family member details"
        columns:
          - name: PARTNER_ID
            description: "FK to CP_PARTNERS.PART_ID"
          - name: CONTRACT_ID
            description: "Policy contract ID"

      - name: BJAZ_HM_MEMBER_DTLS
        description: "Health mediclaim member details (group/retail)"
        columns:
          - name: PARTNER_ID
            description: "FK to CP_PARTNERS.PART_ID"
          - name: CONTRACT_ID
            description: "Policy contract ID"

      - name: BJAZ_EC_MEM_DTLS_EXTN
        description: "Extended cover member details"
        columns:
          - name: PARTNER_ID
            description: "FK to CP_PARTNERS.PART_ID"
          - name: CONTRACT_ID
            description: "Policy contract ID"

      - name: BJAZ_SH_MEM_DTLS_EXTN
        description: "Senior health member details"
        columns:
          - name: PARTNER_ID
            description: "FK to CP_PARTNERS.PART_ID"
          - name: CONTRACT_ID
            description: "Policy contract ID"

      - name: BJAZ_SPP_MEMBER_DTLS
        description: "Super plus member details"
        columns:
          - name: PARTNER_ID
            description: "FK to CP_PARTNERS.PART_ID"
          - name: CONTRACT_ID
            description: "Policy contract ID"

      - name: BJAZ_HLT_ENSURE_MEM_DTLS
        description: "Health ensure member details"
        columns:
          - name: PARTNER_ID
            description: "FK to CP_PARTNERS.PART_ID"
          - name: CONTRACT_ID
            description: "Policy contract ID"

      - name: BJAZ_HC_PART_EXTN
        description: "Health claim partition extension (member risk)"
        columns:
          - name: PART_ID
            description: "FK to CP_PARTNERS.PART_ID"
          - name: CONTRACT_ID
            description: "Policy contract ID"

      - name: BJAZ_PA_DETL_EXTN
        description: "Personal accident detail extension (member)"
        columns:
          - name: PARTNER_ID
            description: "FK to CP_PARTNERS.PART_ID"
          - name: CONTRACT_ID
            description: "Policy contract ID"

      - name: BJAZ_CTNGY_FF_DTLS_EXTN
        description: "Contingency / family floater member details"
        columns:
          - name: PARTNER_ID
            description: "FK to CP_PARTNERS.PART_ID"
          - name: CONTRACT_ID
            description: "Policy contract ID"

      - name: BJAZ_CTNGY_GC_MEM_DATA
        description: "Contingency group corporate member data"
        columns:
          - name: PARTNER_ID
            description: "FK to CP_PARTNERS.PART_ID"

      - name: BJAZ_STARPKG_FF_DTLS
        description: "Star package family floater member details"
        columns:
          - name: PARTNER_ID
            description: "FK to CP_PARTNERS.PART_ID"
          - name: CONTRACT_ID
            description: "Policy contract ID"

      # ============================
      # CLAIM PARTY LINK TABLES
      # ============================
      - name: CLM_INTERESTED_PARTIES
        description: "Claim interested parties - links partners to claims"
        columns:
          - name: CLAIM_ID
            description: "Claim ID"
          - name: PART_ID
            description: "FK to CP_PARTNERS.PART_ID"

      - name: OCP_INTERESTED_PARTIES
        description: "OC Policy interested parties - links partners to policies"
        columns:
          - name: PARTNER_ID
            description: "FK to CP_PARTNERS.PART_ID"
          - name: CONTRACT_ID
            description: "Policy contract ID"

      # ============================
      # REFERENCE / LOOKUP TABLES
      # ============================
      - name: BJAZ_PINCODE
        description: "Pincode lookup - city, state, zone"
        columns:
          - name: PINCODE
            description: "Pincode - PK"

      - name: BJAZ_PINCODE_MASTER
        description: "Pincode master - extended pincode reference with STD codes"
        columns:
          - name: PINCODE
            description: "Pincode - PK"
