name: 'maximus_motor_dv_dbt'
version: '1.0.0'

profile: 'maximus_motor_dbt'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

# Raw source: the Maximus replica maximus_partner_dv_dbt and maximus_travel_dv_dbt read.
vars:
  maximus_motor_raw_database: BAGIC_PROD_MIRROR_DB
  maximus_motor_raw_schema: MAXI_RAW


# Shared vault: every layer lands in BGIL_DATA_MODEL, the schema the opus_*, maximus_* and opus_motor
# projects also write. A hub, link or satellite with the same name is ONE physical table across them.
#   * Never --full-refresh a hub, link or satellite: it drops the other projects' rows.
#   * +on_schema_change: append_new_columns is required, so other projects' columns survive a run.
#   * View layers carry the mxm marker (stg_mxm__, stg2_mxm__, stg2_mxm_aug__, stitch_mxm__) so a run
#     cannot replace a sibling's view of the same name.
models:
  maximus_motor_dv_dbt:
    +pre-hook:
      - "{% if target.name == 'dev' %}INSERT INTO BAGIC_PREPROD_CURATED_DB.UTILS.MAXI_RAW_DBT_MODEL_RUN_LOG (model_name, status, run_id, run_start_timestamp, materialization, schema_name, target_table) SELECT '{{ this.name }}', 'RUNNING', '{{ invocation_id }}', '{{ run_started_at }}'::TIMESTAMP_NTZ, '{{ config.get(\"materialized\", \"view\") }}', '{{ this.schema }}', '{{ this.database }}.{{ this.schema }}.{{ this.name }}'{% endif %}"
    +post-hook:
      - "{% if target.name == 'dev' %}UPDATE BAGIC_PREPROD_CURATED_DB.UTILS.MAXI_RAW_DBT_MODEL_RUN_LOG SET status = 'SUCCESS' WHERE model_name = '{{ this.name }}' AND run_id = '{{ invocation_id }}' AND status = 'RUNNING'{% endif %}"
    staging:
      +materialized: view
      +schema: BGIL_DATA_MODEL
      +tags: ["stg1"]

    raw_vault:
      standard:
        +schema: BGIL_DATA_MODEL
        stitched:
          +materialized: view
          +tags: ["stitch"]
        staging:
          +materialized: view
          +tags: ["standard_stg2"]
        hubs:
          +materialized: incremental
          +tags: ["hub"]
          +on_schema_change: append_new_columns
        links:
          +materialized: incremental
          +tags: ["lnk"]
          +on_schema_change: append_new_columns
        satellites:
          +materialized: incremental
          +tags: ["standard_sat"]
          +on_schema_change: append_new_columns
        references:
          +materialized: view
          +tags: ["ref"]
      augmented:
        +schema: BGIL_DATA_MODEL
        +tags: ["aug"]
        staging:
          +materialized: view
          +tags: ["aug_stg2"]
        satellites:
          +materialized: incremental
          +tags: ["aug_sat"]
          +on_schema_change: append_new_columns

