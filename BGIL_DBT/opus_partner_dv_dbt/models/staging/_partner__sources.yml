version: 2

sources:
  - name: partner_raw
    description: >
      Partner/Party/Intermediary/Provider/Member LOB source tables, landed into Snowflake
      as-is from the upstream OPUS GG_DWHSTAGE extract. Database/schema below are
      placeholders -- point them at wherever this project's raw ingestion actually lands
      these tables before running this project.
    database: "{{ var('partner_raw_database', 'RAW') }}"
    schema: "{{ var('partner_raw_schema', 'GG_DWHSTAGE') }}"
    tables:
      - name: AZBJ_ADDRESS_EXTN
      - name: AZBJ_PARTNER_EXTN
      - name: BA_HCP_DT_MEM
      - name: BJAZ_CLM_SUPP_EXTN
