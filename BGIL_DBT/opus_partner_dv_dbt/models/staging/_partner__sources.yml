      - name: BJAZ_HCF_MEMBER_DTLS
      - name: BJAZ_HC_PART_EXTN
      - name: BJAZ_HLT_ENSURE_MEM_DTLS
      - name: BJAZ_HM_HOSPITAL_MASTER
      - name: BJAZ_HM_MEMBER_DTLS
      - name: BJAZ_INTERMEDIARY
      - name: BJAZ_PA_DETL_EXTN
      - name: BJAZ_PINCODE
      - name: BJAZ_PINCODE_MASTER
      - name: BJAZ_SH_MEM_DTLS_EXTN
