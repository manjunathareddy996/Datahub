      - name: BJAZ_T_CKYC_REL_PERSION_DTLS    # KYC; staged in stg_partner__bjaz_t_ckyc_rel_persion_dtls (PERSION is the source spelling)
      - name: BJAZ_T_CKYC_SEARCH
      - name: BJAZ_T_EKYC
      - name: BJAZ_T_KYC_AUTH
      - name: BJAZ_T_KYC_DETAILS
