# Vendored, matching partner_dv_dbt exactly.
#
# Two reasons this is local rather than a hub reference:
#   * the Snowflake deploy path skips `dbt deps` (see .github/workflows/deploy_dbt_prod.yml),
#     so anything not committed is simply missing at run time.
#   * both projects MUST hash with the same automate_dv build. A hub range like
#     ">=0.11.0,<0.12.0" could resolve to a different patch here than the 0.11.5 partner
#     vendors, and a change in hashing would mean the same party resolves to a different
#     PARTY_HKEY in each project -- which silently breaks the shared vault.
packages:
  - local: dbt_packages/dbt_utils

  - local: dbt_packages/automate_dv
