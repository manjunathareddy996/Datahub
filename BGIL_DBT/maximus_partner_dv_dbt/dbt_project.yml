name: 'maximus_partner_dv_dbt'
version: '1.0.0'
config-version: 2

profile: 'maximus_partner_dv'

model-paths: ["models"]
macro-paths: ["macros"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

vars:
  maximus_partner_raw_database: BAGIC_PROD_MIRROR_DB
  maximus_partner_raw_schema: MAXI_RAW

# Schemas MATCH partner_dv_dbt exactly -- this project writes the SAME physical vault tables from a
# different source system, on its own ingestion schedule. Two projects, one vault.
#
# Consequences, learned the hard way on maximus_health:
#   * every vault model is incremental and append-only. NEVER --full-refresh a shared vault table:
#     it drops the other project's rows, and only its own pipeline will put them back.
#   * +on_schema_change: append_new_columns is required. Each project declares only the payload it
#     populates, so the other's columns must survive a run rather than be dropped.
#   * a hub's src_nk column name must match what partner_dv_dbt already writes (PARENT_BK), or both
#     projects populate different columns of the same table. See models/.../hubfeed/.
models:
  maximus_partner_dv_dbt:
    +pre-hook:
      - "{% if target.name == 'dev' %}INSERT INTO BAGIC_PREPROD_CURATED_DB.UTILS.MAXI_RAW_DBT_MODEL_RUN_LOG (model_name, status, run_id, run_start_timestamp, materialization, schema_name, target_table) SELECT '{{ this.name }}', 'RUNNING', '{{ invocation_id }}', '{{ run_started_at }}'::TIMESTAMP_NTZ, '{{ config.get(\"materialized\", \"view\") }}', '{{ this.schema }}', '{{ this.database }}.{{ this.schema }}.{{ this.name }}'{% endif %}"
    +post-hook:
      - "{% if target.name == 'dev' %}UPDATE BAGIC_PREPROD_CURATED_DB.UTILS.MAXI_RAW_DBT_MODEL_RUN_LOG SET status = 'SUCCESS' WHERE model_name = '{{ this.name }}' AND run_id = '{{ invocation_id }}' AND status = 'RUNNING'{% endif %}"
    staging:
      +materialized: view
      +schema: BGIL_DATA_MODEL
      +tags: ["stg_1"]

    raw_vault:
      standard:
        +schema: BGIL_DATA_MODEL
        staging:
          +materialized: view
        unpivot:
          +materialized: view
        resolvers:
          +materialized: view
        hubfeed:
          +materialized: view
        hubs:
          +materialized: incremental
          +on_schema_change: append_new_columns
        links:
          +materialized: incremental
          +on_schema_change: append_new_columns
        satellites:
          +materialized: incremental
          +on_schema_change: append_new_columns
      augmented:
        +schema: BGIL_DATA_MODEL
        staging:
          +materialized: view
        satellites:
          +materialized: incremental
          +on_schema_change: append_new_columns
