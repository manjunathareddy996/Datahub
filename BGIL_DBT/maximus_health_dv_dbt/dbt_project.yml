name: 'maximus_health_v4_dv'
version: '1.0.0'
config-version: 2

profile: 'maximus_health_v4_dv'

model-paths: ["models"]
macro-paths: ["macros"]

clean-targets:
  - "target"
  - "dbt_packages"

vars:
  maximus_raw_database: RAW
  maximus_raw_schema: MAXIMUS_HEALTH

models:
  maximus_health_v4_dv:
    staging:
      maximus_health:
        +materialized: view
        +schema: stg_maximus_health
    automate_dv:
      standard:
        +schema: std_automate_dv_maximus_health
        stitched:
          +materialized: view
        staging:
          +materialized: view
        hubs:
          +materialized: incremental
        links:
          +materialized: incremental
        satellites:
          +materialized: incremental
        references:
          +materialized: view
      augmented:
        +schema: aug_automate_dv_maximus_health
        staging:
          +materialized: view
        satellites:
          +materialized: incremental
