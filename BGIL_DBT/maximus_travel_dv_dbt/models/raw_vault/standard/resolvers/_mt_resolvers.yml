version: 2

# Guardrails for the spine-join key layer. The two failures here are both SILENT: a
# duplicate join hash fans every child join out, and a child that finds no parent
# drops out of its satellite and reads as 'no data'. Documented per walk so the next
# reader can see what each column is supposed to reach.

models:
  - name: resolved_mt__clm_clmd_clma_msp_msd_prop_pv
    description: >
      1 walk column(s) onto clm_clmd_clma_msp_msd_prop_pv.
    columns:
      - name: w0_claimno
        description: >
          fk_join hop to clm_clmd.CLAIMNO
  - name: resolved_mt__clm_clmd_clmap_pv
    description: >
      4 walk column(s) onto clm_clmd_clmap_pv.
    columns:
      - name: w0_claimno
        description: >
          fk_join hop to clm_clmd.CLAIMNO
      - name: w1_policyno
        description: >
          fk_join hop to clm_clmd.POLICYNO
      - name: w2_claimno
        description: >
          climb hop to clm_clmd.CLAIMNO
      - name: w3_policyno
        description: >
          climb hop to clm_clmd.POLICYNO
