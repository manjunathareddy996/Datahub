name: 'maximus_travel_dv_dbt'
version: '1.0.0'
config-version: 2

profile: 'maximus_travel_dbt'

model-paths: ["models"]
macro-paths: ["macros"]
test-paths: ["tests"]
seed-paths: ["seeds"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

# All shared db / schema / warehouse / table names are centralised in
# ../.env (see BGIL_DBT/.env) and injected via env_var(). Run dbt from
# BGIL_DBT/ so dbt auto-loads that file, or source it beforehand.
vars:
  mt_raw_database: "{{ env_var('MAXIMUS_DB') }}"
  mt_raw_schema:   "{{ env_var('MAXIMUS_SCHEMA') }}"

# SHARED VAULT TABLES
# -------------------
# This project is Maximus Travel. The OPUS build opus_travel_dv_dbt writes the SAME
# physical hub / link / satellite tables. Hubs, links and satellites are incremental,
# so each project appends only its own rows and they stay distinguishable by hub key
# and RECORD_SOURCE.
#
# Consequences, learned the hard way on maximus_health:
#   * every vault model is incremental and append-only. NEVER --full-refresh a shared
#     vault table: it drops the other project's rows, and only its own pipeline will
#     put them back.
#   * +on_schema_change: append_new_columns is REQUIRED. Each project declares only
#     the payload it populates, so the other's columns must survive a run rather than
#     be dropped.
#   * a hub's src_nk column name must match what opus_travel_dv_dbt already writes
#     (PARENT_BK), or both projects populate different columns of the same table.
#     See models/.../hubfeed/.
#
# Intermediate (stg1, stg2, hubfeed, lnkfeed, satfeed, resolvers, unpivot, audit) views
# carry the `mt` infix so they cannot materialise over the sibling's views of the same
# source table. All layers land in BGIL_DATA_MODEL -- the shared raw-vault schema.

models:
  maximus_travel_dv_dbt:
    +pre-hook:
      - "{% if target.name == 'dev' %}INSERT INTO {{ env_var('BGIL_RUN_LOG_TABLE') }} (model_name, status, run_id, run_start_timestamp, materialization, schema_name, target_table) SELECT '{{ this.name }}', 'RUNNING', '{{ invocation_id }}', '{{ run_started_at }}'::TIMESTAMP_NTZ, '{{ config.get(\"materialized\", \"view\") }}', '{{ this.schema }}', '{{ this.database }}.{{ this.schema }}.{{ this.name }}'{% endif %}"
    +post-hook:
      - "{% if target.name == 'dev' %}UPDATE {{ env_var('BGIL_RUN_LOG_TABLE') }} SET status = 'SUCCESS' WHERE model_name = '{{ this.name }}' AND run_id = '{{ invocation_id }}' AND status = 'RUNNING'{% endif %}"

    staging:
      +materialized: view
      +schema: "{{ env_var('BGIL_VAULT_SCHEMA') }}"
      +tags: ["stg1"]

    raw_vault:
      standard:
        +schema: "{{ env_var('BGIL_VAULT_SCHEMA') }}"
        staging:
          +materialized: view
          +tags: ["standard_stg2"]
        unpivot:
          +materialized: view
          +tags: ["unpivot"]
        resolvers:
          +materialized: view
          +tags: ["resolver"]
        hubfeed:
          +materialized: view
          +tags: ["hubfeed"]
        satfeed:
          +materialized: view
          +tags: ["satfeed"]
        audit:
          +materialized: view
          +tags: ["audit"]
        hubs:
          +materialized: incremental
          +tags: ["hub"]
          +on_schema_change: append_new_columns
        links:
          +materialized: incremental
          +tags: ["lnk"]
          +on_schema_change: append_new_columns
        satellites:
          +materialized: incremental
          +tags: ["standard_sat"]
          +incremental_strategy: append
          +on_schema_change: append_new_columns
      augmented:
        +schema: "{{ env_var('BGIL_VAULT_SCHEMA') }}"
        +tags: ["aug"]
        staging:
          +materialized: view
          +tags: ["aug_stg2"]
        satfeed:
          +materialized: view
          +tags: ["aug_satfeed"]
        satellites:
          +materialized: incremental
          +tags: ["aug_sat"]
          +incremental_strategy: append
          +on_schema_change: append_new_columns
