maximus_travel_dbt:
  target: dev # default
  outputs:
    dev:
      type: snowflake
      account: "_" # overwritten by Snowflake CLI connection (env var) at deploy time
      user: "_"    # overwritten by Snowflake CLI connection (env var) at deploy time
      role: "{{ env_var('BGIL_DEV_ROLE') }}"
      warehouse: "{{ env_var('BGIL_WH') }}"
      database: "{{ env_var('BGIL_TARGET_DB_DEV') }}"
      schema: "{{ env_var('BGIL_VAULT_SCHEMA') }}"
      threads: 7

    prod:
      type: snowflake
      role: "{{ env_var('BGIL_PROD_ROLE') }}"
      warehouse: "{{ env_var('BGIL_WH') }}"
      database: "{{ env_var('BGIL_TARGET_DB_PROD') }}"
      schema: "{{ env_var('BGIL_VAULT_SCHEMA') }}"
      account: 'not needed'
      user: 'not needed'
      threads: 4
